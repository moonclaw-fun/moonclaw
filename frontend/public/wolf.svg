<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .z-breathe { animation: breathe 2.5s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
  </style>
  <g class="z-breathe">
    <text x="50" y="55" font-size="80" text-anchor="middle" dominant-baseline="middle">🐺</text>
  </g>
</svg>
